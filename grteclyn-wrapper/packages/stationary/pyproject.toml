[project]
name = "grteclyn-stationary"
version = "0.1.0"
description = "Stationary Einstein-scalar solvers and independent validation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "jax>=0.4.30",
    "cma>=3.3",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
symbolic = ["sympy>=1.12"]

[project.scripts]
grteclyn-stationary = "grteclyn_stationary.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "hatchling"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grteclyn_stationary"]
