# Campaign M solver pipeline -- the runnable stages, one place.
#
#   pipeline.py plan          the ten steps and what is next (from STATUS.md)
#   pipeline.py list          these stages and their live state
#   pipeline.py run <stage>   launch one through capped_job.sh (CPU)
#   pipeline.py run <stage> --gpu N    the same solve on CUDA card N
#
# A stage is one capped job; its name is the job name (runs/capped_jobs/<name>).
# The record of what ran and what it showed lives in STATUS.md, not here.

[campaign]
name = "M (minimal exotic wormhole search)"
branch = "feature/optimisation"
status = "research/optimisation/STATUS.md"
python = "grteclyn-wrapper/.venv/bin/python"
runner = "grteclyn-wrapper/scripts/ops/capped_job.sh"

[defaults]
threads = 4
mem_gb = 120        # host address-space cap (ulimit -v)
gpu_mem_gb = 220    # with --gpu: CUDA's virtual reservations need headroom;
                    # the solve itself lives on the card
timeout_s = 7200

# -- step 3 entry: the first-V mass ladders ---------------------------------

[[stage]]
name = "first-v-0003-150"
step = "3-entry"
title = "fam_b_0003 (v_e 0.27) kink ladder at 150x30: the m = 0.1 gate chase"
script = "grteclyn-wrapper/scripts/optimisation/first_matter_solve.py"
args = ["results/spinningwormhole/solutions/fam_b/fam_b_0003.json",
        "--nx", "150", "--ny", "30"]

[[stage]]
name = "first-v-0012-150"
step = "3-entry"
title = "fam_b_0012 (v_e 0.50) kink ladder at 150x30: second spin"
script = "grteclyn-wrapper/scripts/optimisation/first_matter_solve.py"
args = ["results/spinningwormhole/solutions/fam_b/fam_b_0012.json",
        "--nx", "150", "--ny", "30"]

[[stage]]
name = "first-v-0025-150"
step = "3-entry"
title = "fam_b_0025 (v_e 0.85) kink ladder at 150x30: third spin"
script = "grteclyn-wrapper/scripts/optimisation/first_matter_solve.py"
args = ["results/spinningwormhole/solutions/fam_b/fam_b_0025.json",
        "--nx", "150", "--ny", "30"]

[[stage]]
name = "first-v-0003-180"
step = "3-entry"
title = "fam_b_0003 kink ladder at 180x36: the small-m monitor-gate rung"
script = "grteclyn-wrapper/scripts/optimisation/first_matter_solve.py"
args = ["results/spinningwormhole/solutions/fam_b/fam_b_0003.json",
        "--nx", "180", "--ny", "36"]

# -- step 3: the shape and gamma scans at three spins ------------------------
# Q = 1 + q1 u + q2 u^2 in u = psi/psi_minus (potentials.kink_q) at the
# pure-kink anchor mass 0.3, which passes the monitor gate at 150x30 at
# all three spins (2026-10-28); gamma walks to the drainhole's -pi.

[[stage]]
name = "q-scan-0003-150"
step = "3"
title = "fam_b_0003 (v_e 0.27) shape scan at m 0.3, 150x30"
script = "grteclyn-wrapper/scripts/optimisation/scan_potential.py"
args = ["results/spinningwormhole/solutions/fam_b/fam_b_0003.json",
        "--mass", "0.3", "--q1=-0.6,-0.3,0,0.3,0.6",
        "--q2=-0.6,-0.3,0,0.3,0.6", "--nx", "150", "--ny", "30"]

[[stage]]
name = "q-scan-0012-150"
step = "3"
title = "fam_b_0012 (v_e 0.50) shape scan at m 0.3, 150x30"
script = "grteclyn-wrapper/scripts/optimisation/scan_potential.py"
args = ["results/spinningwormhole/solutions/fam_b/fam_b_0012.json",
        "--mass", "0.3", "--q1=-0.6,-0.3,0,0.3,0.6",
        "--q2=-0.6,-0.3,0,0.3,0.6", "--nx", "150", "--ny", "30"]

[[stage]]
name = "q-scan-0025-150"
step = "3"
title = "fam_b_0025 (v_e 0.85) shape scan at m 0.3, 150x30"
script = "grteclyn-wrapper/scripts/optimisation/scan_potential.py"
args = ["results/spinningwormhole/solutions/fam_b/fam_b_0025.json",
        "--mass", "0.3", "--q1=-0.6,-0.3,0,0.3,0.6",
        "--q2=-0.6,-0.3,0,0.3,0.6", "--nx", "150", "--ny", "30"]

[[stage]]
name = "gamma-scan-0003-150"
step = "3"
title = "fam_b_0003 gamma scan to -pi at the pure kink m 0.3, 150x30"
script = "grteclyn-wrapper/scripts/optimisation/scan_potential.py"
args = ["results/spinningwormhole/solutions/fam_b/fam_b_0003.json",
        "--mass", "0.3",
        "--gammas=-0.3927,-0.7854,-1.1781,-1.5708,-1.9635,-2.3562,-2.7489,-3.1416",
        "--nx", "150", "--ny", "30"]

[[stage]]
name = "gamma-scan-0012-150"
step = "3"
title = "fam_b_0012 gamma scan to -pi at the pure kink m 0.3, 150x30"
script = "grteclyn-wrapper/scripts/optimisation/scan_potential.py"
args = ["results/spinningwormhole/solutions/fam_b/fam_b_0012.json",
        "--mass", "0.3",
        "--gammas=-0.3927,-0.7854,-1.1781,-1.5708,-1.9635,-2.3562,-2.7489,-3.1416",
        "--nx", "150", "--ny", "30"]

[[stage]]
name = "gamma-scan-0025-150"
step = "3"
title = "fam_b_0025 gamma scan to -pi at the pure kink m 0.3, 150x30"
script = "grteclyn-wrapper/scripts/optimisation/scan_potential.py"
args = ["results/spinningwormhole/solutions/fam_b/fam_b_0025.json",
        "--mass", "0.3",
        "--gammas=-0.3927,-0.7854,-1.1781,-1.5708,-1.9635,-2.3562,-2.7489,-3.1416",
        "--nx", "150", "--ny", "30"]

# -- step 3 extension: the open-ended ray walks (decided 2026-10-28) ---------
# No preset box past +q1,+q2: each ray continues until Newton fails, the
# monitors pass 1e-6 twice running, or X rises three rungs.

[[stage]]
name = "q-rays-0003-150"
step = "3"
title = "fam_b_0003 (v_e 0.27) open ray walk at m 0.3, 150x30"
script = "grteclyn-wrapper/scripts/optimisation/scan_potential.py"
args = ["results/spinningwormhole/solutions/fam_b/fam_b_0003.json",
        "--mass", "0.3", "--rays", "0.3,0;0,0.3;0.3,0.3",
        "--nx", "150", "--ny", "30"]

[[stage]]
name = "q-rays-0012-150"
step = "3"
title = "fam_b_0012 (v_e 0.50) open ray walk at m 0.3, 150x30"
script = "grteclyn-wrapper/scripts/optimisation/scan_potential.py"
args = ["results/spinningwormhole/solutions/fam_b/fam_b_0012.json",
        "--mass", "0.3", "--rays", "0.3,0;0,0.3;0.3,0.3",
        "--nx", "150", "--ny", "30"]

[[stage]]
